apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fincompliance-dev
  annotations:
    config.kubernetes.io/local-config: "true"

bases:
- ../../base

namespace: fincompliance-dev

namePrefix: dev-

commonLabels:
  environment: development

patchesStrategicMerge:
- |-
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: fincompliance-config
    namespace: fincompliance-dev
  data:
    ENVIRONMENT: "development"
    DEBUG: "true"
    LOG_LEVEL: "debug"
    DATABASE_URL: "postgresql://postgres:postgres@postgres-dev:5432/fincompliance_dev"
    REDIS_URL: "redis://redis-dev:6379"
    ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8501,http://127.0.0.1:3000,http://127.0.0.1:8501"
    ALLOWED_HOSTS: "localhost,127.0.0.1,*.local"
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: dev-fincompliance-api
    namespace: fincompliance-dev
  spec:
    replicas: 1
    template:
      spec:
        containers:
        - name: api
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: dev-fincompliance-ui
    namespace: fincompliance-dev
  spec:
    replicas: 1
    template:
      spec:
        containers:
        - name: ui
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
