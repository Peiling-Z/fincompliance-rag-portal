apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fincompliance-base
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- serviceaccount.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml

commonLabels:
  app.kubernetes.io/name: fincompliance-rag-portal
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  config.kubernetes.io/local-config: "true"

images:
- name: gcr.io/your-gcp-project/fincompliance-rag-portal
  newTag: latest

patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: fincompliance-api
    namespace: fincompliance
  spec:
    template:
      spec:
        containers:
        - name: api
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
