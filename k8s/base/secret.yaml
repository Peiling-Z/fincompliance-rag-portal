apiVersion: v1
kind: Secret
metadata:
  name: fincompliance-secrets
  namespace: fincompliance
  labels:
    app.kubernetes.io/name: fincompliance-rag-portal
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  SECRET_KEY: "your-secret-key-base64-encoded"
  CLOUD_SQL_PASSWORD: "your-cloud-sql-password-base64-encoded"
  OPENAI_API_KEY: "your-openai-api-key-base64-encoded"
  
  # GCP Service Account Key (if using JSON key)
  GCP_SERVICE_ACCOUNT_KEY: "your-gcp-service-account-key-base64-encoded"
  
  # JWT settings
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  
  # Database connection pool settings
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"
