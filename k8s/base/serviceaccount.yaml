apiVersion: v1
kind: ServiceAccount
metadata:
  name: fincompliance-sa
  namespace: fincompliance
  labels:
    app.kubernetes.io/name: fincompliance-rag-portal
    app.kubernetes.io/component: serviceaccount
  annotations:
    iam.gke.io/gcp-service-account: fincompliance-sa@your-gcp-project.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fincompliance-role
  labels:
    app.kubernetes.io/name: fincompliance-rag-portal
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fincompliance-rolebinding
  labels:
    app.kubernetes.io/name: fincompliance-rag-portal
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fincompliance-role
subjects:
- kind: ServiceAccount
  name: fincompliance-sa
  namespace: fincompliance
