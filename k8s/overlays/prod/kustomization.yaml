apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fincompliance-prod
  annotations:
    config.kubernetes.io/local-config: "true"

bases:
- ../../base

namespace: fincompliance

commonLabels:
  environment: production

patchesStrategicMerge:
- |-
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: fincompliance-config
    namespace: fincompliance
  data:
    ENVIRONMENT: "production"
    DEBUG: "false"
    LOG_LEVEL: "info"
    DATABASE_URL: "postgresql://postgres:postgres@postgres-prod:5432/fincompliance"
    REDIS_URL: "redis://redis-prod:6379"
    ALLOWED_ORIGINS: "https://api.fincompliance.com,https://app.fincompliance.com"
    ALLOWED_HOSTS: "api.fincompliance.com,app.fincompliance.com"
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: fincompliance-api
    namespace: fincompliance
  spec:
    replicas: 5
    template:
      spec:
        containers:
        - name: api
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: fincompliance-ui
    namespace: fincompliance
  spec:
    replicas: 3
    template:
      spec:
        containers:
        - name: ui
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
- |-
  apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: fincompliance-api-hpa
    namespace: fincompliance
  spec:
    minReplicas: 5
    maxReplicas: 20
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
- |-
  apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: fincompliance-ui-hpa
    namespace: fincompliance
  spec:
    minReplicas: 3
    maxReplicas: 10
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
